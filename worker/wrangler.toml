name = "janky-studio-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# docs/config.js のURLを指定。CORSの許可先になります。
SITE_ORIGIN = "https://jankyjanky0920.github.io"
# デプロイしたWorkerの公開URL（LINE/Bufferが動画を取得するため）
MEDIA_ORIGIN = "https://janky-studio-api.jankyjanky70.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "janky-studio-db"
database_id = "414e894f-b146-493f-b93f-37985969e2d9"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "janky-studio-media"

[triggers]
crons = ["*/5 * * * *"]
